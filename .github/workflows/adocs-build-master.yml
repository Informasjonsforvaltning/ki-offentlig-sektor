name: build adocs

permissions:
  contents: write

on:
  push:
    branches:
    - master

jobs:
  build-adocs:
    name: Build and deploy to GitHub Pages
    uses: Informasjonsforvaltning/workflows/.github/workflows/specification-github-pages.yaml@main
    with:
      program_html: |
        asciidoctor -D docs -o index.html -a lang=nb docs/main.adoc
      program_pdf: |
        asciidoctor-pdf -D docs -o document.pdf -a lang=nb docs/main.adoc
      program_pdf_continue_on_error: true
      publish_branch: html
      publish_dir: ./docs
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
